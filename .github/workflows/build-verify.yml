name: Build verify

# Guards the preview build: any change that breaks typecheck (e.g. a TS2304
# "cannot find name" from a dropped import) or the Vite build fails CI before
# it can reach the preview.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        # tsconfig.app.json targets ignoreDeprecations "6.0", which classic tsc
        # 5.x rejects — the native preview compiler is the one the preview uses.
        run: bunx --package @typescript/native-preview tsgo -p tsconfig.app.json --noEmit

      - name: Unit tests
        run: bunx vitest run
      - name: Vite build
        run: bunx vite build
