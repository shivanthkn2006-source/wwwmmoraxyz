<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Universe of Life - mmora.xyz</title>
    <meta name="description" content="Next-generation AI platform powered by Zoe - available at mmora.xyz">
    <meta name="author" content="Universe of Life Platform" />
    <meta name="keywords" content="mmora, universe of life, zoe ai, social platform, ai assistant" />
    
    <!-- Preload critical resources to reduce render delay -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="preload" href="/src/index.css" as="style" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Configuration - Cross-Browser Compatible -->
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    
    <!-- iOS Safari PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zoe Infinity" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    
    <!-- Android Chrome PWA -->
    <meta name="application-name" content="Zoe Infinity" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Disable auto-formatting on iOS -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Performance hints for browsers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mmora.xyz" />
    <meta property="og:title" content="Universe of Life - mmora.xyz">
    <meta property="og:description" content="Experience the future with Zoe AI - Your intelligent companion for life">
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mmora_platform" />
    <meta name="twitter:title" content="Universe of Life - mmora.xyz">
    <meta name="twitter:description" content="Experience the future with Zoe AI - Your intelligent companion for life">
    <meta name="twitter:image" content="/icon-512.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://mmora.xyz" />
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
